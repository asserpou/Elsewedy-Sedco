<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.location.href = 'index.html';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Sedco</title>
  <link rel="icon" type="image/png" href="assets/Logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          colors: {
            'brand-red': '#E32636',
            'brand-red-light': '#ff3b4b',
            'brand-dark': '#1a1a1a',
            'brand-gray-medium': '#666666'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
    }
    .auth-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(8px) brightness(0.4);
      transform: scale(1.05);
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px 20px; /* offset for navbar */
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid transparent;
      color: var(--brand-gray-medium);
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      color: var(--brand-red);
      border-bottom-color: var(--brand-red);
    }
    .auth-input {
      width: 100%;
      background: rgba(249, 250, 251, 0.8);
      color: var(--brand-dark);
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s;
    }
    .auth-input:focus {
      background: #fff;
      border-color: var(--brand-red);
      box-shadow: 0 0 0 4px rgba(227, 38, 54, 0.1);
    }
  </style>
</head>
<body>

  <nav class="navbar scrolled" style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <div class="section-container nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-bg">
          <img src="assets/Logo.gif" alt="Elsewedy SEDCO">
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home<span class="underline"></span></a>
        <a href="about.html">About<span class="underline"></span></a>
        <a href="solutions.html">Solutions<span class="underline"></span></a>
        <a href="marketplace.html">Marketplace<span class="underline"></span></a>
        <a href="contact.html" class="nav-cta">Contact Us</a>
      </div>
      <button class="mobile-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="auth-bg">
    <img src="assets/images/about-hero-bg.png" alt="Background">
  </div>

  <div class="auth-container">
    <div class="auth-card">
      
      <div id="authForms">
        <div class="flex mb-8">
          <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Log In</button>
          <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm font-semibold text-center border border-red-100"></div>
        <div id="successMsg" class="hidden mb-4 p-3 bg-green-50 text-green-600 rounded-lg text-sm font-semibold text-center border border-green-100"></div>

        <form id="authForm" class="flex flex-col gap-4">
          <div id="nameField" style="display: none;">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
            <input type="text" id="fullName" name="fullName" class="auth-input" placeholder="John Doe">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required class="auth-input" placeholder="you@company.com">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required class="auth-input" placeholder="********">
          </div>
          <div id="confirmPasswordField" style="display: none;">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" placeholder="********">
          </div>
          
          <div class="flex justify-center mt-2 cf-turnstile" data-sitekey="0x4AAAAAADChdcuQwHP5S8Ia" data-theme="light"></div>
          
          <button type="submit" id="submitBtn" class="w-full bg-[#E32636] text-white py-3.5 rounded-xl font-bold tracking-wide hover:bg-[#ff3b4b] transition-all shadow-lg mt-4">
            Log In
          </button>
        </form>
      </div>

      <div id="verificationStep" style="display: none;" class="flex flex-col gap-4 text-center">
        <h3 class="text-2xl font-bold text-[#1a1a1a] mb-2">Check Your Email</h3>
        <p class="text-gray-600 mb-4">We've sent an 8-digit verification code to your email address. Please enter it below to verify your account.</p>
        <input type="text" id="otpCode" placeholder="00000000" maxlength="8" class="auth-input text-center tracking-widest text-3xl font-mono">
        <button type="button" id="verifyBtn" class="w-full bg-[#1a1a1a] text-white py-3.5 rounded-xl font-bold tracking-wide hover:bg-black transition-all shadow-lg mt-4">
            Verify Account
        </button>
        <button type="button" onclick="location.reload()" class="text-sm text-[#E32636] font-semibold hover:underline mt-2">Start over</button>
      </div>

      <div id="loggedInState" style="display: none;" class="flex flex-col gap-4 text-center py-6">
        <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="40" height="40"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="text-2xl font-bold text-[#1a1a1a]">You are logged in!</h3>
        <p class="text-gray-600" id="loggedInEmail"></p>
        <button type="button" id="logoutBtn" class="w-full bg-gray-200 text-[#1a1a1a] py-3.5 rounded-xl font-bold hover:bg-gray-300 transition-all mt-6">
            Log Out
        </button>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        if(window.lucide) lucide.createIcons();
    });
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
